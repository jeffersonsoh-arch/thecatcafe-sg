<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Your Booking | The Cat Cafe Singapore</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#D85A30">
<style>
  :root {
    --cream:#f5efe8; --rust:#D85A30; --rust-dark:#993C1D; --rust-pale:#FAECE7;
    --green:#2E7D32; --green-pale:#E8F5E9;
    --red:#C62828; --red-pale:#FFEBEE;
    --amber:#E65100; --amber-pale:#FFF3E0;
    --text:#1a1a1a; --text-2:#555; --text-3:#999;
    --border:#e4e0db; --border-light:#f0ede9;
    --bg:#fff; --bg-2:#faf9f7;
    --radius:12px; --radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);background:var(--bg);font-size:15px;line-height:1.6;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);border-bottom:0.5px solid var(--border);}
  .nav-inner{max-width:560px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;}
  .nav-logo{font-size:15px;font-weight:600;color:var(--text);}
  .nav-logo span{color:var(--rust);}
  .nav-back{font-size:13px;color:var(--text-2);}

  .page{max-width:560px;margin:0 auto;padding:36px 24px 80px;}
  .card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:26px 24px;}
  .state-msg{text-align:center;padding:32px 16px;color:var(--text-3);font-size:14px;}

  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:4px 12px;border-radius:12px;margin-bottom:16px;}
  .badge.confirmed{background:var(--green-pale);color:var(--green);}
  .badge.cancelled{background:var(--red-pale);color:var(--red);}
  .badge.completed{background:var(--rust-pale);color:var(--rust-dark);}
  .badge.no_show{background:var(--amber-pale);color:var(--amber);}

  .detail-title{font-size:22px;font-weight:600;margin-bottom:18px;}
  .detail-row{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:0.5px solid var(--border-light);}
  .detail-row:last-child{border-bottom:none;}
  .detail-row span:first-child{color:var(--text-3);}
  .detail-row span:last-child{font-weight:600;text-align:right;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 24px;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;border:none;text-decoration:none;width:100%;margin-top:18px;}
  .btn-danger{background:var(--red-pale);color:var(--red);}
  .btn-danger:hover{opacity:0.85;}
  .btn-danger:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-outline{background:#fff;color:var(--text);border:0.5px solid var(--border);}

  .cutoff-note{font-size:12px;color:var(--text-3);margin-top:14px;text-align:center;}
  .error-box{background:var(--red-pale);color:var(--red);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;margin-top:14px;display:none;}
  .error-box.show{display:block;}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">The Cat <span>Cafe</span></a>
    <a href="/" class="nav-back">&larr; Back to site</a>
  </div>
</nav>

<div class="page">
  <div class="card" id="content">
    <div class="state-msg">Loading your booking&hellip;</div>
  </div>
</div>

<script>
function fmtTime(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "pm" : "am";
  const h12 = h % 12 || 12;
  return m === 0 ? `${h12}${period}` : `${h12}:${String(m).padStart(2,"0")}${period}`;
}
function timeToMinutes(hhmm) { const [h,m] = hhmm.split(":").map(Number); return h*60+m; }
function minutesToTime(mins) { const h = Math.floor(mins/60)%24, m = mins%60; return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`; }
function slotLabel(slot) {
  const endMins = timeToMinutes(slot.start_time) + slot.duration_minutes;
  return `${fmtTime(slot.start_time)} - ${fmtTime(minutesToTime(endMins))}`;
}
function fmtDateLong(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  return d.toLocaleDateString("en-SG", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
function escapeHTML(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
const STATUS_LABEL = { confirmed:"Confirmed", cancelled:"Cancelled", completed:"Completed", no_show:"No-show" };

const params = new URLSearchParams(location.search);
const id = params.get("id");
const token = params.get("token");
const content = document.getElementById("content");

async function load() {
  if (!id || !token) {
    content.innerHTML = '<div class="state-msg">This link is missing booking details. Please use the link from your confirmation email.</div>';
    return;
  }
  try {
    const res = await fetch(`/api/bookings-detail?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Booking not found");
    render(data.booking, data.slot, data.can_cancel);
  } catch (e) {
    content.innerHTML = `<div class="state-msg">${escapeHTML(e.message)}</div>`;
  }
}

function render(booking, slot, canCancel) {
  const badgeClass = booking.status;
  const cancelSection = canCancel
    ? `<button class="btn btn-danger" id="cancel-btn" onclick="cancelBooking()">Cancel this booking</button>
       <div class="error-box" id="cancel-error"></div>`
    : (booking.status === "confirmed"
        ? '<div class="cutoff-note">This booking is past the cancellation window and can no longer be cancelled online. Please call us if you need help.</div>'
        : "");

  content.innerHTML = `
    <span class="badge ${badgeClass}">${STATUS_LABEL[booking.status] || booking.status}</span>
    <div class="detail-title">Booking for ${escapeHTML(booking.guest_name)}</div>
    <div class="detail-row"><span>Date</span><span>${escapeHTML(fmtDateLong(booking.date))}</span></div>
    ${slot ? `<div class="detail-row"><span>Time</span><span>${escapeHTML(slotLabel(slot))}</span></div>` : ""}
    <div class="detail-row"><span>Party size</span><span>${booking.party_size}</span></div>
    <div class="detail-row"><span>Contact</span><span>${escapeHTML(booking.guest_email)}</span></div>
    ${booking.guest_phone ? `<div class="detail-row"><span>Phone</span><span>${escapeHTML(booking.guest_phone)}</span></div>` : ""}
    ${booking.notes ? `<div class="detail-row"><span>Notes</span><span>${escapeHTML(booking.notes)}</span></div>` : ""}
    <div class="detail-row"><span>Reference</span><span>${booking.id.slice(0,8).toUpperCase()}</span></div>
    ${cancelSection}
  `;
}

async function cancelBooking() {
  if (!confirm("Cancel this booking? This can't be undone.")) return;
  const btn = document.getElementById("cancel-btn");
  const errBox = document.getElementById("cancel-error");
  btn.disabled = true;
  btn.textContent = "Cancelling…";
  errBox.classList.remove("show");
  try {
    const res = await fetch("/api/bookings-cancel", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, token })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not cancel booking");
    load();
  } catch (e) {
    errBox.textContent = e.message;
    errBox.classList.add("show");
    btn.disabled = false;
    btn.textContent = "Cancel this booking";
  }
}

load();
</script>
</body>
</html>
